# Fly.io (one small machine is enough for several 15v15 rooms: ~4 ms CPU per 50 ms tick at 30 players).
#   cd apps/special-soldier && fly launch --config server/fly.toml --dockerfile server/Dockerfile --no-deploy
#   fly deploy --config server/fly.toml --dockerfile server/Dockerfile
# Then players enter wss://<app>.fly.dev in the lobby's DEDICATED SERVER field (or share ?mp=ROOM&server=wss://<app>.fly.dev).
app = "special-soldier-mp"
primary_region = "nrt"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  grace_period = "5s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
