# Runs the UNI&CORE SEO engine every day. Scheduled workflows only run from the default branch,
# so this file lives on main, while the engine and the promotion site live on the PR #2 branch.
# The job checks out that branch, runs the engine, and commits the report back to it.
name: UNI&CORE engine – daily run
on:
  schedule:
    - cron: "0 16 * * *" # 01:00 Asia/Seoul
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: unincore-engine-daily
  cancel-in-progress: false
env:
  ENGINE_BRANCH: claude/awesome-gauss-5kqwk2
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: unincore-engine
    env:
      # Optional. Without DATABASE_URL each run starts from an empty SQLite file (no history).
      DATABASE_URL: ${{ secrets.ENGINE_DATABASE_URL }}
      # Engine tables live in their own schema, apart from the other tables in the shared Supabase project.
      ENGINE_DB_SCHEMA: seo_engine
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ENGINE_BRANCH }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: unincore-engine/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m engine daily
      - name: Commit the daily report to the engine branch
        run: |
          git config user.name "unincore-engine"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json data/reports ../unincore-promotion/src/content/seo-overrides.json
          git diff --cached --quiet && exit 0
          git commit -m "engine: daily report $(date -u +%F)"
          # Other jobs also commit to this branch; rebase onto them before pushing.
          for i in 1 2 3; do
            git pull --rebase origin "$ENGINE_BRANCH" && git push origin "HEAD:$ENGINE_BRANCH" && exit 0
            sleep 5
          done
          exit 1
