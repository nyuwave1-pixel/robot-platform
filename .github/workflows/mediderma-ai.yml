name: mediderma-ai
on:
  pull_request:
    paths: ["apps/mediderma-ai/**", ".github/workflows/mediderma-ai.yml"]
  push:
    branches: [main]
    paths: ["apps/mediderma-ai/**"]
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mediderma-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mediderma-ai/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
