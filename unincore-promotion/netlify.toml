# Netlify project: unincore-promotion (base directory = unincore-promotion when linked via Git)
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Next.js runtime (SSR, route handlers, middleware). Declared explicitly so
# CLI/API-uploaded deploys also run it, not only Git-linked builds.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# The project's netlify.app address permanently forwards to the custom domain
# (deploy permalinks like <id>--unincore-promotion.netlify.app keep working).
[[redirects]]
  from = "https://unincore-promotion.netlify.app/*"
  to = "https://promotion.unincore.com/:splat"
  status = 301
  force = true

# Common sitemap URLs people submit to Search Console / Naver → the real sitemap.
[[redirects]]
  from = "/sitemap"
  to = "/sitemap.xml"
  status = 301
  force = true
[[redirects]]
  from = "/sitemap_index.xml"
  to = "/sitemap.xml"
  status = 301
  force = true
[[redirects]]
  from = "/sitemap-index.xml"
  to = "/sitemap.xml"
  status = 301
  force = true
[[redirects]]
  from = "/sitemap.html"
  to = "/sitemap.xml"
  status = 301
  force = true
